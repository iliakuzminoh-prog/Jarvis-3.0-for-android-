name: Build JARVIS Android APK
on:
  push:
    branches:
      - main
      - jarvis-rebuild-v4
      - jarvis-v5-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: jarvis-android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Clean
        run: gradle --no-daemon clean
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log
      - name: Run unit tests
        if: success()
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon :app:testDebugUnitTest --stacktrace --warning-mode all && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Test dependency download failed; retrying ($attempt/3)."
              sleep 15
            fi
          done
          exit 1
      - name: Run Android lint
        if: success()
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon :app:lintDebug --stacktrace --warning-mode all && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Lint dependency download failed; retrying ($attempt/3)."
              sleep 15
            fi
          done
          exit 1
      - name: Check APK exists
        if: success()
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature
        if: success()
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk"
      - name: Record APK checksum
        if: success()
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload build output and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V5-debug-apk-and-build-log
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            build.log
          if-no-files-found: warn
}